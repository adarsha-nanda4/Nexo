<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Add New Product</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-[#181111] dark:text-gray-100 font-display min-h-screen flex flex-col">
    <div
        class="relative flex h-full w-full md:max-w-5xl mx-auto flex-col flex-1 bg-background-light dark:bg-background-dark md:bg-white md:dark:bg-[#1a0b0b] md:shadow-2xl md:rounded-2xl md:my-8 md:h-auto md:min-h-0 md:border md:border-[#e6dbdb] md:dark:border-[#3a1a1a] overflow-hidden min-h-screen">
        <div
            class="sticky top-0 z-30 flex items-center justify-between bg-background-light/95 dark:bg-background-dark/95 md:bg-white/95 md:dark:bg-[#1a0b0b]/95 backdrop-blur-md p-4 border-b border-[#e6dbdb] dark:border-[#3a1a1a]">
            <a href="{% url "seller_profile" %}">
                <button
                    class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-[#111418] dark:text-white transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
            </a>
            <h2 class="text-lg font-bold leading-tight text-center md:text-left">Add Product</h2>

            <div class="w-12 md:hidden"></div>
        </div>
        <div class="flex-1 overflow-y-auto pb-32 md:pb-0">
        <form
            class="grid grid-cols-1 md:grid-cols-2 gap-6 p-4 md:p-8"
            enctype="multipart/form-data"
            method="post"
            action="{% if is_edit %}{% url 'add_edit_product' product.id %}{% else %}{% url 'add_edit_product' %}{% endif %}"
        >
            {% csrf_token %}

            <!-- Product Title -->
            <div class="flex flex-col gap-2 order-2 md:order-1 md:col-span-1">
                <label class="text-base font-medium leading-normal text-[#181111] dark:text-gray-200">
                    Product Title
                </label>
                <input
                    class="form-input flex w-full rounded-xl border border-[#e6dbdb] dark:border-[#4a2e2e] bg-white dark:bg-[#2c1818] h-14 px-4 text-base focus:border-primary focus:ring-primary dark:text-white placeholder:text-[#8a6060]/60 transition-colors"
                    name="title"
                    type="text"
                    placeholder="e.g. Vintage Leather Jacket"
                    value="{{ product.title|default:'' }}"
                />
            </div>

            <!-- Price -->
            <div class="flex flex-col gap-2 order-3 md:order-2 md:col-span-1">
                <label class="text-base font-medium leading-normal text-[#181111] dark:text-gray-200">
                    Price
                </label>
                <div class="relative flex items-center">
                    <div class="absolute left-0 pl-4 pointer-events-none">
                        <span class="text-[#8a6060] font-medium">₹</span>
                    </div>
                    <input
                        class="form-input flex w-full rounded-xl border border-[#e6dbdb] dark:border-[#4a2e2e] bg-white dark:bg-[#2c1818] h-14 pl-8 pr-4 text-base focus:border-primary focus:ring-primary dark:text-white placeholder:text-[#8a6060]/60 transition-colors"
                        name="price"
                        type="number"
                        step="0.01"
                        placeholder="0.00"
                        value="{{ product.price|default:'' }}"
                    />
                </div>
            </div>

            <!-- Category -->
            <div class="flex flex-col gap-2 order-4 md:order-3 md:col-span-1">
                <label class="text-base font-medium leading-normal text-[#181111] dark:text-gray-200">
                    Category
                </label>
                <select
                    class="form-select flex w-full rounded-xl border border-[#e6dbdb] dark:border-[#4a2e2e] bg-white dark:bg-[#2c1818] h-14 px-4 text-base focus:border-primary focus:ring-primary dark:text-white appearance-none cursor-pointer"
                    name="category"
                >
                    <option disabled value="">Select</option>
                    {% for pt in product_category %}
                        <option value="{{ pt.category }}"
                            {% if product and product.category == pt %}selected{% endif %}>
                            {{ pt.category }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Product Image -->
            <div class="flex flex-col gap-2 order-1 md:order-4 md:col-span-1">
                <label class="text-base font-medium leading-normal text-[#181111] dark:text-gray-200">
                    Product Image
                </label>

                <div class="relative group cursor-pointer">
                    <div
                        class="w-full aspect-[3/2] rounded-xl border-2 border-dashed border-[#e6dbdb] dark:border-[#4a2e2e] bg-white dark:bg-[#2c1818] overflow-hidden relative flex items-center justify-center">

                        <!-- Existing Image (EDIT MODE) -->
                        {% if is_edit and product.image %}
                            <img
                                id="imagePreview"
                                src="{{ product.image.url }}"
                                class="absolute inset-0 w-full h-full object-cover rounded-xl"
                                alt="Product image">
                        {% else %}
                            <div id="imagePlaceholder" class="flex flex-col items-center gap-3 text-center p-6">
                                <div class="size-12 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                                    <span class="material-symbols-outlined text-[24px]">add_a_photo</span>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-primary">Tap to upload</p>
                                    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
                                        PNG, JPG, GIF (max 5MB)
                                    </p>
                                </div>
                            </div>
                        {% endif %}

                        <input
                            id="imageInput"
                            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                            name="image"
                            type="file"
                            accept="image/*">
                    </div>
                </div>
            </div>


            <!-- Description -->
            <div class="flex flex-col gap-2 order-5 md:col-span-2">
                <label class="text-base font-medium leading-normal text-[#181111] dark:text-gray-200">
                    Description
                </label>
                <textarea
                    class="form-textarea flex w-full rounded-xl border border-[#e6dbdb] dark:border-[#4a2e2e] bg-white dark:bg-[#2c1818] p-4 text-base focus:border-primary focus:ring-primary dark:text-white placeholder:text-[#8a6060]/60 resize-none transition-colors"
                    name="description"
                    rows="5"
                    placeholder="Describe your product..."
                >{{ product.description|default:'' }}</textarea>
            </div>

            <!-- Submit Button -->
            <div class="order-6 md:col-span-2 flex justify-center md:justify-end">
                <button
                    class="w-full max-w-md md:max-w-xs bg-primary hover:bg-red-700 text-white font-bold text-lg h-14 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                    type="submit"
                >
                    <span>
                        {% if is_edit %}Update Product{% else %}Publish Product{% endif %}
                    </span>
                    <span class="material-symbols-outlined text-[20px]">check_circle</span>
                </button>
            </div>
        </form>

        </div>

    </div>
    <script>
        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");
        const placeholder = document.getElementById("imagePlaceholder");

        imageInput?.addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);

            if (imagePreview) {
                imagePreview.src = url;
            } else {
                const img = document.createElement("img");
                img.id = "imagePreview";
                img.src = url;
                img.className = "absolute inset-0 w-full h-full object-cover rounded-xl";
                this.parentElement.appendChild(img);
            }

            if (placeholder) placeholder.style.display = "none";
        });
    </script>


</body>

</html>
