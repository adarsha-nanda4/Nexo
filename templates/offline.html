<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>You're Offline - E-Commerce</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e13a37",
              "background-light": "#f8f6f6",
              "background-dark": "#211211",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      body {
        font-family: "Inter", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col items-center justify-center font-display"
  >
    <main
      class="flex flex-col items-center justify-center px-6 py-12 max-w-md w-full text-center"
    >
      <div class="flex flex-col items-center gap-10 w-full">
        <div class="relative w-64 h-64 flex items-center justify-center">
          <div
            class="absolute inset-0 bg-primary/10 dark:bg-primary/20 rounded-full"
          ></div>
          <div class="relative flex flex-col items-center">
            <div
              class="bg-white dark:bg-[#2d1a19] p-8 rounded-full shadow-xl border border-primary/20"
            >
              <span
                class="material-symbols-outlined text-primary text-7xl"
                style="font-variation-settings: &quot;FILL&quot; 1"
              >
                signal_wifi_off
              </span>
            </div>
            <div
              class="absolute -bottom-2 -right-2 bg-primary text-white p-3 rounded-full shadow-lg"
            >
              <span class="material-symbols-outlined text-2xl">cable</span>
            </div>
          </div>
        </div>
        <div class="flex flex-col items-center gap-3">
          <h1
            class="text-[#171111] dark:text-white text-3xl font-bold leading-tight tracking-tight"
          >
            You're Offline
          </h1>
          <p
            class="text-[#5c4a4a] dark:text-[#a08d8d] text-base font-normal leading-relaxed max-w-[280px]"
          >
            Please check your internet connection and try again.
          </p>
        </div>
        <div class="w-full mt-4">
          <button
            class="flex w-full cursor-pointer items-center justify-center gap-2 overflow-hidden rounded-full h-14 px-8 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-lg shadow-primary/30 active:scale-95 transition-transform"
          >
            <span class="material-symbols-outlined">refresh</span>
            <span class="truncate"><a href="{% url "dashboard" %}">Retry Connection</a></span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
