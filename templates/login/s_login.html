<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Red Seller Login</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#181111] dark:text-white transition-colors duration-200">
    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden lg:justify-center">
        <div
            class="flex-1 flex flex-col lg:grid lg:grid-cols-2 lg:gap-20 lg:items-center lg:flex-none w-full max-w-md lg:max-w-7xl mx-auto px-6 pt-8 pb-32 lg:pb-0 lg:px-16 lg:py-12">
            <div
                class="w-full aspect-[16/10] lg:aspect-auto lg:h-[600px] mb-6 lg:mb-0 rounded-2xl overflow-hidden bg-white dark:bg-[#331a1a] shadow-sm lg:shadow-md order-1">
                <div class="w-full h-full bg-center bg-contain bg-no-repeat relative"
                    data-alt="Vector illustration of a shop owner standing proudly in front of a red storefront"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDe_TBQW6pbC_puu0aylvkpo-Ny5gzPQuGM7G4mVg7ctCz8Xg3oq1DlsFhu_GISqbD6svAA5hEarabYrZ0eM-_fHfII-5pGYGojkjDvKq4RDhuTDn5yj7VkElpOs9S0grejab1LNM3rW4TmptilQ-uv5AQj-7Cg4Toj0_IzQsAke39lSqOOMFfQX99dPGzC9vVcRt_px3jkn-9Wc4Fv9Bj8WWv9j0mZGXnm2bSpSVlisFJOWE9gHx--UxMEer2975PRWT8Y6qFWzf4");'>
                    <div
                        class="w-full h-full bg-gradient-to-t from-background-light/80 to-transparent dark:from-background-dark/80 mix-blend-overlay">
                    </div>
                </div>
            </div>
            <div class="flex flex-col justify-center w-full order-2">
                <div class="w-full mb-8 lg:mb-10">
                    <h1
                        class="text-[#181111] dark:text-white tracking-tight text-[32px] lg:text-4xl font-bold leading-tight text-center lg:text-left">
                        Seller Login
                    </h1>
                    <p class="text-center lg:text-left text-[#8a6060] dark:text-red-200/70 mt-2 text-sm lg:text-base">
                        Manage your account and products
                    </p>
                </div>
                <form class="w-full flex flex-col gap-5" action="{% url 'login' %}" method="post">
                    {% csrf_token %}

                    <!-- Phone -->
                    <div class="relative w-full group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-[#8a6060] dark:text-red-300">
                                call
                            </span>
                        </div>
                        <input
                            class="form-input block w-full pl-12 pr-4 h-14 rounded-lg border border-[#e6dbdb]
                                dark:border-red-900/30 bg-white dark:bg-[#2c1414]
                                text-base placeholder-[#8a6060] dark:placeholder-red-300/50
                                text-[#181111] dark:text-white focus:border-primary
                                focus:ring-1 focus:ring-primary focus:outline-none transition-all"
                            placeholder="Phone Number"
                            type="tel"
                            name="phone"
                            inputmode="numeric"
                            required
                        />
                    </div>

                    <!-- Password -->
                    <div class="relative w-full group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-[#8a6060] dark:text-red-300">
                                lock
                            </span>
                        </div>

                        <input
                            id="passwordInput"
                            class="form-input block w-full pl-12 pr-12 h-14 rounded-lg border border-[#e6dbdb]
                                dark:border-red-900/30 bg-white dark:bg-[#2c1414]
                                text-base placeholder-[#8a6060] dark:placeholder-red-300/50
                                text-[#181111] dark:text-white focus:border-primary
                                focus:ring-1 focus:ring-primary focus:outline-none transition-all"
                            placeholder="Password"
                            type="password"
                            name="password"
                            required
                        />

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute inset-y-0 right-0 pr-4 flex items-center
                                cursor-pointer text-[#8a6060] dark:text-red-300
                                hover:text-primary transition-colors"
                            aria-label="Toggle password visibility"
                        >
                            <span
                                id="passwordIcon"
                                class="material-symbols-outlined"
                            >
                                visibility
                            </span>
                        </button>
                    </div>

                    <!-- Submit -->
                    <button
                        type="submit"
                        class="w-full h-14 mt-2 bg-primary hover:bg-red-700 text-white
                            font-bold text-lg rounded-lg shadow-lg shadow-primary/20
                            active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                    >
                        <span>Log In</span>
                        <span class="material-symbols-outlined text-[20px]">
                            login
                        </span>
                    </button>
                </form>

                <div class="w-full flex flex-col gap-5">
                    <div class="w-full px-2 mt-2">
                        <p class="text-sm text-center lg:text-left text-[#6e5353] dark:text-gray-400 leading-relaxed">
                            Forgot your password? Please contact the admin at <a
                                class="font-semibold text-primary hover:underline decoration-2 underline-offset-2"
                                href="mailto:admin@example.com">admin@nexo.vercel.app</a> to reset it.
                        </p>
                    </div>

                    <div class="w-full max-w-md mx-auto flex flex-col items-center gap-3">
                        <span class="text-xs font-medium uppercase tracking-wider text-[#8a6060] dark:text-red-300/70">New to
                            the platform?</span>
                        <button
                            class="w-full h-12 bg-transparent border-2 border-primary text-primary dark:text-white dark:border-primary hover:bg-primary/5 dark:hover:bg-primary/10 font-bold text-base rounded-lg transition-colors">
                            <a href="{% url "registration" %}"> Become a Seller </a>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div
        class="lg:hidden  bottom-0 left-0 w-full p-6 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-t border-[#e6dbdb] dark:border-red-900/30 z-10 safe-area-bottom">
        
    </div>
    </div>
    <nav class="fixed bottom-0 left-0 z-50 w-full bg-white dark:bg-[#101922] border-t border-gray-200 dark:border-gray-800 pb-safe">
        <div class="flex h-16 items-center justify-around px-8">
            <a href="{% url "dashboard" %}">
                <button class="flex flex-col items-center justify-center gap-1 w-full h-full text-primary">
                    <span class="material-symbols-outlined fill-current text-[28px]">home</span>
                    <span class="text-[10px] font-bold">Home</span>
                </button>
            </a>
            <a href="{% url "login" %}">
                <button
                    class="flex flex-col items-center justify-center gap-1 w-full h-full text-[#617589] dark:text-gray-400 hover:text-[#111418] dark:hover:text-white transition-colors">
                    <span class="material-symbols-outlined text-[28px]">person</span>
                    <span class="text-[10px] font-medium">Account</span>
                </button>
            </a>
        </div>
    </nav>
    <script>
            (function () {
                const passwordInput = document.getElementById("passwordInput");
                const togglePassword = document.getElementById("togglePassword");
                const passwordIcon = document.getElementById("passwordIcon");

                if (!passwordInput || !togglePassword || !passwordIcon) return;

                togglePassword.addEventListener("click", function () {
                    const isHidden = passwordInput.type === "password";

                    passwordInput.type = isHidden ? "text" : "password";
                    passwordIcon.textContent = isHidden
                        ? "visibility_off"
                        : "visibility";
                });
            })();
    </script>

</body>

</html>
