<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Seller Registration</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20d0d",
                        "background-light": "#f8f5f5",
                        "background-dark": "#221010",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen text-[#181111] dark:text-white font-display transition-colors duration-200">
    <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-4xl mx-auto">
        <header
            class="sticky top-0 z-10 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 md:px-8 pb-2 justify-between transition-colors duration-200">
            <button
                class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined text-[#181111] dark:text-white"
                    style="font-size: 24px;">arrow_back_ios_new</span>
            </button>
            <h2
                class="text-[#181111] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">
                Become a Seller</h2>
        </header>
        <main class="flex-1 px-4 md:px-8 py-2 pb-8">
            <div class="flex flex-col gap-1 pb-6 pt-2 md:pb-8">
                <h1
                    class="text-[#181111] dark:text-white text-[28px] md:text-3xl font-bold leading-tight tracking-[-0.015em] text-left">
                    Start your business journey today</h1>
                <p class="text-[#181111]/70 dark:text-white/70 text-base font-normal leading-normal">Join thousands of
                    successful shops on our platform.</p>
            </div>
            <form class="flex flex-col gap-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-x-8 md:gap-y-6">
                    <label class="flex flex-col">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal pb-2">Full Name
                        </p>
                        <input
                            class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#181111] dark:text-white border border-[#e6dbdb] dark:border-red-900/30 bg-white dark:bg-[#381e1e] focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-[#8a6060] dark:placeholder:text-red-200/30 p-[15px] text-base font-normal leading-normal transition-all outline-none"
                            placeholder="Jane Doe" type="text" />
                    </label>
                    <label class="flex flex-col">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal pb-2">Phone Number
                        </p>
                        <input
                            class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#181111] dark:text-white border border-[#e6dbdb] dark:border-red-900/30 bg-white dark:bg-[#381e1e] focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-[#8a6060] dark:placeholder:text-red-200/30 p-[15px] text-base font-normal leading-normal transition-all outline-none"
                            placeholder="+1 (555) 000-0000" type="tel" />
                    </label>
                    <label class="flex flex-col">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal pb-2">Email
                            Address</p>
                        <input
                            class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#181111] dark:text-white border border-[#e6dbdb] dark:border-red-900/30 bg-white dark:bg-[#381e1e] focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-[#8a6060] dark:placeholder:text-red-200/30 p-[15px] text-base font-normal leading-normal transition-all outline-none"
                            placeholder="jane@example.com" type="email" />
                    </label>
                    <div class="flex flex-col">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal pb-2">Password</p>
                        <div class="relative">
                            <input
                                class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#181111] dark:text-white border border-[#e6dbdb] dark:border-red-900/30 bg-white dark:bg-[#381e1e] focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-[#8a6060] dark:placeholder:text-red-200/30 p-[15px] pr-12 text-base font-normal leading-normal transition-all outline-none"
                                placeholder="Create a secure password" type="password" />
                            <button
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-[#8a6060] dark:text-red-200/50 hover:text-primary transition-colors"
                                type="button">
                                <span class="material-symbols-outlined" style="font-size: 24px;">visibility_off</span>
                            </button>
                        </div>
                        <div class="flex gap-1 mt-2">
                            <div class="h-1 flex-1 rounded-full bg-primary"></div>
                            <div class="h-1 flex-1 rounded-full bg-gray-200 dark:bg-white/10"></div>
                            <div class="h-1 flex-1 rounded-full bg-gray-200 dark:bg-white/10"></div>
                            <div class="h-1 flex-1 rounded-full bg-gray-200 dark:bg-white/10"></div>
                        </div>
                        <p class="text-xs text-[#8a6060] dark:text-red-200/50 mt-1">Must be at least 8 characters</p>
                    </div>
                    <label class="flex flex-col md:col-span-2">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal pb-2">Physical
                            Address</p>
                        <textarea
                            class="form-textarea flex w-full min-w-0 resize-none overflow-hidden rounded-xl text-[#181111] dark:text-white border border-[#e6dbdb] dark:border-red-900/30 bg-white dark:bg-[#381e1e] focus:border-primary focus:ring-1 focus:ring-primary min-h-[80px] placeholder:text-[#8a6060] dark:placeholder:text-red-200/30 p-[15px] text-base font-normal leading-normal transition-all outline-none"
                            placeholder="Street, City, Zip Code"></textarea>
                    </label>
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <p class="text-[#181111] dark:text-white text-base font-medium leading-normal">ID Proof Image
                        </p>
                        <div
                            class="group relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-[#e6dbdb] dark:border-red-900/30 hover:border-primary dark:hover:border-primary rounded-xl bg-white dark:bg-[#381e1e] transition-all cursor-pointer">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <div
                                    class="p-2 rounded-full bg-primary/10 mb-2 group-hover:bg-primary/20 transition-colors">
                                    <span class="material-symbols-outlined text-primary"
                                        style="font-size: 28px;">cloud_upload</span>
                                </div>
                                <p class="mb-1 text-sm text-[#181111] dark:text-white"><span class="font-semibold">Click
                                        to upload</span> or drag and drop</p>
                                <p class="text-xs text-[#8a6060] dark:text-red-200/50">SVG, PNG, JPG or GIF (MAX. 5MB)
                                </p>
                            </div>
                            <input class="hidden" id="dropzone-file" type="file" />
                        </div>
                    </div>
                </div>
                <div class="flex flex-col gap-4 items-center mb-8 mt-4 md:mt-8">
                    <button
                        class="w-full md:w-auto md:min-w-[320px] bg-primary hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl text-base shadow-lg shadow-primary/20 transition-all active:scale-[0.98]"
                        type="button">
                        Register as Seller
                    </button>
                    <button
                        class="flex items-center justify-center gap-1 text-[#181111] dark:text-white text-sm font-medium p-2 hover:opacity-70 transition-opacity"
                        type="button">
                        <span>Already a seller?</span>
                        <span class="text-primary font-bold">Login</span>
                    </button>
                </div>
            </form>
        </main>
    </div>

</body>

</html>
